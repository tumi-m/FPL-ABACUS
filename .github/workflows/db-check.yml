name: db-check

# Is production's database actually usable?
#
# prod-cron used to answer this by going red on every tick — the same
# unchanging sentence ("relation cohort_snapshot does not exist") mailed out
# around the clock, which is how a real alert turns into something you filter
# to a folder. A missing schema is not an outage: nothing is broken, no retry
# helps, and it stays exactly as true in five minutes as it is now.
#
# So the tick treats it as a skip, and this runs once a day to make sure the
# skip is never quietly permanent. One alert a day, naming the fix, instead of
# ten saying nothing new.
#
# The fix, when this fails: Actions → db-migrate → Run workflow.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: db-check
  cancel-in-progress: false

jobs:
  check:
    name: schema present
    runs-on: ubuntu-latest
    steps:
      - name: Ask the cohort endpoint
        env:
          URL: ${{ secrets.PROD_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "PROD_URL and CRON_SECRET are not set; nothing to check."
            exit 0
          fi
          # Same normalisation as prod-cron: a trailing slash or a bare http://
          # origin answers 308, and without -L curl reports that as success.
          URL="${URL%/}"
          URL="${URL/#http:\/\//https://}"

          out=$(curl -sS -L -m 120 --retry 2 --retry-delay 3 \
                     -w $'\n%{http_code}' \
                     -H "Authorization: Bearer $SECRET" \
                     "$URL/api/cron/cohort" 2>&1) || true
          code=$(printf '%s' "$out" | tail -n 1)
          body=$(printf '%s' "$out" | sed '$d')
          echo "→ /api/cron/cohort [$code]"
          echo "   ${body:0:600}"

          if printf '%s' "$body" | grep -q '"skipped":"no-schema"'; then
            # Name the prerequisite, not just the action. db-migrate needs a
            # DATABASE_URL repository secret and fails without one, so an
            # alert that says only "run db-migrate" sends the reader into a
            # second failure to discover the first step for themselves.
            # The direct link, because db-migrate only has workflow_dispatch and
            # a workflow that has never run does not appear in the Actions run
            # list at all — it is in the left sidebar, which is easy to miss.
            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "::error::Production's database has no schema, so the cohort snapshot cannot be built and effective ownership stays estimated. Run the migration here: ${REPO_URL}/actions/workflows/db-migrate.yml — press 'Run workflow'. It needs a DATABASE_URL repository secret pointing at the SAME Neon database Vercel uses. This check goes green on the next run."
            {
              echo "### Production database has no schema"
              echo ""
              echo "**[Run the migration](${REPO_URL}/actions/workflows/db-migrate.yml)** — open that page and press **Run workflow**."
              echo ""
              echo "> db-migrate has never run, so it does not appear in the Actions *run* list. It is in the left sidebar of the Actions page, or at the link above."
              echo ""
              echo "It needs a \`DATABASE_URL\` repository secret (Settings → Secrets and variables → Actions) holding the connection string for **the same Neon database Vercel uses** — migrating a different branch or project will not help production."
              echo ""
              echo "Safe to re-run: drizzle records what it has applied and skips it. Re-running *this* check will not fix anything on its own; only the migration creates the tables."
              echo ""
              echo "Until then the app falls back to estimated effective ownership — that is what the tilde on every ownership figure means."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if printf '%s' "$body" | grep -q '"skipped":"no-database-configured"'; then
            echo "::error::DATABASE_URL is not set on the deployment, so every database-backed job is a no-op."
            exit 1
          fi

          case "$code" in
            2*) echo "Schema is present; the cohort job is doing its work." ;;
            *)  echo "::error::cohort endpoint answered $code"; exit 1 ;;
          esac
